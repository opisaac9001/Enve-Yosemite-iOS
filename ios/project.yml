name: EnveYosemite
options:
  bundleIdPrefix: dev.petty
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    INFOPLIST_OUTPUT_FORMAT: xml
targets:
  # Public name is Enve Yosemite. The target, module, source folder, product name and bundle ID keep
  # their pre-rename values so the installed app, its Application Support data and Keychain items carry over.
  PettyFieldGuide:
    type: application
    platform: iOS
    sources:
      - path: PettyFieldGuide
        excludes:
          - "Resources/**"
      # Each pack folder is copied to the bundle root by name. They must never be nested under a
      # folder called "Resources": CFBundle treats that as the deep (macOS) layout and stops reading
      # Info.plist, which makes the simulator refuse the install with "Missing bundle ID".
      - path: PettyFieldGuide/Resources/Content
        type: folder
        buildPhase: resources
      - path: PettyFieldGuide/Resources/Geo
        type: folder
        buildPhase: resources
      - path: PettyFieldGuide/Resources/Documents
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.petty.fieldguide
        PRODUCT_NAME: PettyFieldGuide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: PettyFieldGuide/Info.plist
      properties:
        CFBundleDisplayName: "Enve Yosemite"
        CFBundleName: "Enve Yosemite"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Used only when you ask: to show your live position on the offline maps while the app is open, sort places by distance, or pin your parked car. Live positions stay in memory on this device and are never recorded or sent; a car position is saved only when you choose."
        UIApplicationSupportsIndirectInputEvents: true
        LSApplicationCategoryType: public.app-category.travel
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.petty.fieldguide
            CFBundleURLSchemes: [enveyosemite, pettyfieldguide]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [remote-notification]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: false
        UIRequiresFullScreen: false
    entitlements:
      path: PettyFieldGuide/PettyFieldGuide.entitlements
      properties:
        aps-environment: development
  PettyFieldGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PettyFieldGuideTests
    dependencies:
      - target: PettyFieldGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.petty.fieldguide.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EnveYosemite:
    build:
      targets:
        PettyFieldGuide: all
        PettyFieldGuideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PettyFieldGuideTests
    archive:
      config: Release
